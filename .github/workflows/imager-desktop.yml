# LordOS Imager desktop downloads (docs/IMAGER.md, "Building the desktop downloads"). Builds the Mac,
# Windows and Linux downloads on hosted runners and keeps them as workflow artifacts. Runs only by
# hand: nothing is published or signed here.
name: Imager desktop downloads
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
            label: mac
          - os: windows-2022
            bundles: nsis
            label: windows
          - os: ubuntu-24.04
            bundles: deb
            label: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/imager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build packages
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: npm ci --no-audit --no-fund
      - run: node build-web.mjs
      - name: Core tests
        run: cargo test -p lordos-imager-core
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: lordos-imager-${{ matrix.label }}
          path: |
            desktop/imager/target/release/bundle/dmg/*.dmg
            desktop/imager/target/release/bundle/nsis/*.exe
            desktop/imager/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
