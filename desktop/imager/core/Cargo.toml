[package]
name = "lordos-imager-core"
description = "LordOS Imager: release signature, image reading and verified writing (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
xz2 = { version = "0.1", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha-crypt = "0.5"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
