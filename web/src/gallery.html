<!doctype html>
<html lang="{{t.lang}}">
<head>
{{{head}}}
</head>
<body data-page="gallery" data-lang="{{t.lang}}">
<a class="skip" href="#main">{{t.skip}}</a>
{{{header}}}

<main id="main" class="wrap wide g-main">
<p class="kicker">{{t.gallery.kicker}}</p>
<h1>{{t.gallery.title}}</h1>
<p class="g-lead">{{t.gallery.lead}}</p>

<div class="g-bar">
<div class="g-cats" role="group" aria-label="{{t.gallery.filterLabel}}">
{{{catButtons}}}
</div>
<div class="g-themes" role="group" aria-label="{{t.gallery.themeLabel}}">
<button type="button" class="g-chip" data-theme="all" aria-pressed="true">{{t.gallery.all}}</button>
<button type="button" class="g-chip" data-theme="light" aria-pressed="false">{{t.gallery.light}}</button>
<button type="button" class="g-chip" data-theme="dark" aria-pressed="false">{{t.gallery.dark}}</button>
</div>
</div>

<div class="g-grid" id="shots">
{{{shots}}}
</div>
<p class="g-more" id="g-more" hidden><button type="button" class="btn btn-ghost">{{t.gallery.more}}</button></p>
<p class="g-empty" id="g-empty" hidden>{{t.gallery.empty}}</p>
<p class="g-note">{{t.gallery.note}}</p>
</main>

{{{lightbox}}}

{{{footer}}}
<script src="{{{js}}}" defer></script>
</body>
</html>
