<!doctype html>
<html lang="{{t.lang}}">
<head>
{{{head}}}
{{{jsonld}}}
</head>
<body data-page="faq" data-lang="{{t.lang}}">
<a class="skip" href="#main">{{t.skip}}</a>
{{{header}}}

<main id="main" class="wrap g-main faq">
<p class="kicker">FAQ</p>
<h1>{{t.pages.faq.title}}</h1>
<p class="g-lead">{{t.pages.faq.lead}}</p>
<div class="faq-tools">
<label class="faq-search"><span class="vh">{{t.pages.faq.search}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="faq-q" placeholder="{{t.pages.faq.search}}" autocomplete="off"></label>
<nav class="g-cats" aria-label="{{t.pages.faq.categories}}">
{{{chips}}}
</nav>
</div>
<p class="g-empty" id="faq-empty" hidden>{{t.pages.faq.empty}}</p>
{{{sections}}}
</main>

{{{footer}}}
<script src="{{{js}}}" defer></script>
</body>
</html>
