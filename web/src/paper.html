<!doctype html>
<html lang="{{t.lang}}">
<head>
{{{head}}}
</head>
<body data-page="paper" data-lang="{{t.lang}}">
<a class="skip" href="#main">{{t.skip}}</a>
{{{header}}}

<main id="main">
<header class="wrap paper-head">
<p class="kicker">{{t.pages.paper.kicker}}</p>
<h1>{{{title}}}</h1>
<p class="paper-sub">{{{subtitle}}}</p>
<p class="paper-meta">{{{meta}}}</p>
<p class="paper-actions">{{{pdf}}}</p>
</header>
<div class="wrap paper">
<nav class="toc" aria-label="{{t.pages.paper.toc}}">
<p class="toc-t">{{t.pages.paper.toc}}</p>
{{{toc}}}
</nav>
<div>
<details class="toc-m">
<summary>{{t.pages.paper.toc}}</summary>
<nav class="toc" aria-label="{{t.pages.paper.toc}}">{{{toc}}}</nav>
</details>
<article class="prose">
{{{body}}}
</article>
</div>
</div>
</main>

{{{lightbox}}}
{{{footer}}}
<script src="{{{js}}}" defer></script>
</body>
</html>
