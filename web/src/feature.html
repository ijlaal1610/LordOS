<!doctype html>
<html lang="{{t.lang}}">
<head>
{{{head}}}
</head>
<body data-page="feature" data-lang="{{t.lang}}">
<a class="skip" href="#main">{{t.skip}}</a>
{{{header}}}

<main id="main">
<section class="wrap fhero" aria-labelledby="f-title">
<img class="fhero-lumo" src="{{{lumo}}}" alt="" width="300" height="300">
<div class="fhero-txt">
<p class="kicker">{{t.pages.featuresKicker}}</p>
<h1 id="f-title">{{{title}}}</h1>
<p class="ftag">{{{tagline}}}</p>
<blockquote class="bubble" aria-label="{{t.pages.lumoSays}}"><p>{{{intro}}}</p></blockquote>
</div>
</section>

<div class="wrap fbody">
<article class="prose">
{{{body}}}
</article>
{{{shots}}}
<section aria-labelledby="src-h" class="prose">
<h2 id="src-h">{{t.pages.sourcesTitle}}</h2>
<p>{{t.pages.sourcesLead}}</p>
<ul class="sources">
{{{sources}}}
</ul>
</section>
<nav aria-label="{{t.pages.allFeatures}}">
<ul class="pn">
{{{prevnext}}}
</ul>
</nav>
</div>
</main>

{{{lightbox}}}
{{{footer}}}
<script src="{{{js}}}" defer></script>
</body>
</html>
