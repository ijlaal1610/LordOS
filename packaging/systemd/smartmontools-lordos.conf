# LordOS: Debian's smartd monitoring daemon stays off. The Disks app and the Monitor read SMART on
# demand through smartctl (docs/SYSTEM.md, "smartd"); smartd would poll every disk every 30 minutes
# and mail root, which goes nowhere on a desktop. An administrator who wants it creates
# /etc/lordos/smartd-enabled and runs: systemctl start smartmontools
[Unit]
ConditionPathExists=/etc/lordos/smartd-enabled
