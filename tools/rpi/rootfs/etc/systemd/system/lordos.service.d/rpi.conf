# Raspberry Pi: before lord-sessiond, wait for vc4 (HDMI) to appear in /sys/class/drm. On the
# Pi 5, v3d can end up as card0 with no connectors, and if lord-sessiond starts before vc4 is
# loaded it does not find the display (server/src/drmcard.h). See docs/RASPBERRY.md.
[Unit]
After=lordos-rpi-firstboot.service
Wants=lordos-rpi-firstboot.service

[Service]
# the list is reset so the boot splash hand-off (lordos-splash deactivate) stays the last step,
# after vc4 is there
ExecStartPre=
ExecStartPre=-/usr/lib/lordos/lordos-live-prep
ExecStartPre=-/usr/lib/lordos/rpi/wait-kms
ExecStartPre=-/usr/lib/lordos/lordos-splash deactivate
