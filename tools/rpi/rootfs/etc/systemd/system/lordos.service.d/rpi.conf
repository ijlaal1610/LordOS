# Raspberry Pi: antes de lord-sessiond, esperar a que vc4 (HDMI) aparezca en /sys/class/drm. En la
# Pi 5 v3d puede quedar en card0 sin conectores, y si lord-sessiond arranca antes de que se cargue
# vc4 no encuentra la pantalla (server/src/drmcard.h). Ver docs/RASPBERRY.md.
[Unit]
After=lordos-rpi-firstboot.service
Wants=lordos-rpi-firstboot.service

[Service]
ExecStartPre=-/usr/lib/lordos/rpi/wait-kms
