# LordOS: PulseAudio clients may not load modules into pipewire-pulse.
#
# pipewire-pulse runs outside every app's scope, so a module a restricted Linux app loaded would
# work for it with none of its restrictions: a loopback from the microphone into a pipe or a TCP
# server (no microphone), a tunnel or RTP sender to any host (no network), a pipe at any path of
# the home folder (no files). Devices and Bluetooth are WirePlumber's, not modules: nothing in the
# desktop needs this. Someone who does can turn it back on in
# ~/.config/pipewire/pipewire-pulse.conf.d/ (see docs/FIREWALL.md, "Linux apps").
pulse.properties = {
    pulse.allow-module-loading = false
}
