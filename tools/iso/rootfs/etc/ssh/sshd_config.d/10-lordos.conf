# LordOS · remote login (SSH) defaults. See docs/REMOTE.md, "Remote login (SSH)".
#
# The SSH server (openssh-server) is not installed by default: Settings → Sharing → "Remote login
# (SSH)" installs it and turns it on. sshd keeps the first value it reads for each option and
# Debian's sshd_config includes this folder at the top, so these win over the settings below it.
#
# Root never logs in over the network; administrators log in with their own account and use sudo.
PermitRootLogin no
# Password logins stay on (users expect them). Key logins work as well: copy your public key with
# `ssh-copy-id <user>@<this computer>` and, once it works, you may add a file in this folder with
# "PasswordAuthentication no".
